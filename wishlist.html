<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Haven - Wishlist</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="wishliststyle.css">
</head>
<body>

    <!-- ========== HEADER (exact match) ========== -->
      <header class="header">
        <div class="header-left">
            <!-- Menu Icon -->
            <div class="menu-icon" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <a href="index.html" class="logo">TOY HAVEN</a>
        </div>

        <nav class="desktop-nav">
            <a href="index.html">HOME</a>
            <a href="products.html">PRODUCTS</a>
            <a href="wishlist.html" class="active">WISHLIST</a>
            <a href="cart.html" >CART (<span id="cartCount">0</span>)</a>
        </nav>
    </header>
     <div class="mobile-menu" id="mobile-menu">
        <a href="index.html">HOME</a>
        <a href="products.html">PRODUCTS</a>
        <a href="wishlist.html">WISHLIST</a>
        <a href="cart.html">CART</a>
        <a href="support.html">SUPPORT</a>
    </div>

    <!-- ========== MAIN ========== -->
    <main class="wishlist-page">
        <p class="breadcrumb"><a href="index.html">HOME</a> &gt; WISHLIST</p>
        <h1>MY PRODUCT COLLECTION</h1>

        <div class="wishlist-top">
            <p>SAVED PRODUCTS: <b id="savedCount">0</b></p>

            <div class="filter-group">
                <label for="wishlistFilter">FILTER:</label>
                <select id="wishlistFilter" onchange="filterWishlist()">
                <option value="all">ALL</option>
                <option value="interested">INTERESTED</option>
                <option value="owned">OWNED</option>
                </select>
            </div>
        </div>

        <div class="wishlist-list" id="wishlistList">
            <!-- Items will be rendered by JS -->
        </div>
    </main>

    <!-- ========== FOOTER (exact match) ========== -->
    <footer class="footer">
        <div class="footer-links">
            <a href="index.html">HOME</a>
            <a href="products.html">PRODUCTS</a>
            <a href="wishlist.html">WISHLIST</a>
            <a href="cart.html">CART</a>
            <a href="support.html">SUPPORT</a>
        </div>
        <p>© 2026 Toy Haven. All rights reserved.</p>
    </footer>
