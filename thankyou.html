<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <title>Thank You | Toy Haven</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" >
  <link rel="stylesheet" href="thankyou.css" >
</head>
<body>

  <!-- ===== HEADER  ===== -->
  <header class="header">
    <div class="header-left">
      <button class="menu-btn" aria-label="Menu">☰</button>
      <a href="index.html" class="logo">TOY HAVEN</a>
    </div>
    <nav class="nav">
      <a href="index.html">HOME</a>
      <a href="products.html">PRODUCTS</a>
      <a href="wishlist.html">WISHLIST</a>
      <a href="cart.html" class="cart-link">CART (<span id="cartCount">0</span>)</a>
    </nav>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main">
    <div class="thank-you-card">
      <div class="success-icon">✓</div>
      <h1 class="thank-you-title">THANK YOU!</h1>
      <p class="success-text">Your order has been placed successfully!</p>

      <!-- Order Summary -->
      <div class="order-summary" id="orderSummary">
        <!-- Filled by JS -->
      </div>

      <!-- Ordered Items -->
      <div class="items-section" id="itemsSection">
        <h2 class="items-title">Ordered Items</h2>
        <div id="itemsList">
          <!-- Filled by JS -->
        </div>
      </div>

      <!-- Buttons -->
      <div class="btn-group">
        <a href="products.html" class="btn btn-primary">CONTINUE SHOPPING</a>
        <a href="index.html" class="btn btn-secondary">BACK TO HOME</a>
      </div>
    </div>
  </main>

  <!-- ===== FOOTER  ===== -->
  <footer class="footer">
    <div class="footer-links">
      <a href="index.html">HOME</a>
      <a href="products.html">PRODUCTS</a>
      <a href="wishlist.html">WISHLIST</a>
      <a href="cart.html">CART</a>
      <a href="support.html">SUPPORT</a>
    </div>
    <p class="copyright">© 2026 Toy Haven. All rights reserved.</p>
  </footer>

  <script src="thankyou.js"></script>
</body>
</html>
